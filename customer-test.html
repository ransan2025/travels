<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Customer Travel Portal
    </title>

    <meta name="theme-color" content="#0f172a">

    <meta name="description" content="Customer Booking Dashboard">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Portal CSS -->

    <link rel="stylesheet" href="customer/customer.css">
<link rel="stylesheet" href="customer/customer_modification.css">


</head>

<body>

    <!--====================================================
    APP
    =====================================================-->

    <div id="customerPortalApp" class="customerPortalApp">

        <!-- Background -->

        <div class="portalBackground">

            <div class="bgBlur bg1"></div>

            <div class="bgBlur bg2"></div>

            <div class="bgBlur bg3"></div>

        </div>

        <!--====================================================
        LOADING SCREEN
        =====================================================-->

        <div id="portalLoading" class="portalLoading">

            <div class="portalLoadingGlass">

                <div class="portalLoader"></div>

                <div class="portalLoadingTitle">

                    Customer Portal

                </div>

                <div class="portalLoadingSub">

                    Loading your booking...

                </div>

            </div>

        </div>

        <!--====================================================
CUSTOMER LOGIN
====================================================-->

        <div id="portalAuth" class="portalAuth hidden">

            <div class="portalGlass portalAuthCard">

                <!-- Logo -->

                <div class="portalLogo">

                    🌍

                </div>

                <div class="portalAuthTitle">

                    Customer Portal

                </div>

                <div class="portalAuthSubtitle">

                    Secure Booking Access

                </div>

                <!--=========================
        STEP 1
        PHONE
        =========================-->

                <div id="phoneStep">

                    <div class="portalInputGroup">

                        <label>

                            Mobile Number

                        </label>

                        <input id="customerPhone" class="portalInput" type="tel" maxlength="10"
                            placeholder="Enter Mobile Number">

                    </div>

                    <button id="sendOtpBtn" class="portalPrimaryBtn">

                        📲 Send WhatsApp OTP

                    </button>

                </div>

                <!--=========================
        STEP 2
        OTP
        =========================-->

                <div id="otpStep" class="hidden">

                    <div class="portalInputGroup">

                        <label>

                            Enter OTP

                        </label>

                        <input id="customerOTP" class="portalInput portalOTPInput" type="text" maxlength="6"
                            placeholder="6 Digit OTP">

                    </div>

                    <button id="verifyOtpBtn" class="portalPrimaryBtn">

                        🔓 Verify OTP

                    </button>

                    <button id="resendOtpBtn" class="portalSecondaryBtn">

                        ↻ Resend OTP

                    </button>

                </div>

                <!--=========================
        MESSAGE
        =========================-->

                <div id="portalLoginMessage" class="portalLoginMessage">

                </div>

            </div>

        </div>

        <!--====================================================
        DASHBOARD
        =====================================================-->

        <div id="portalDashboard" class="portalDashboard hidden">

            <!-- Header -->

            <header id="portalHeader" class="portalHeader">

                <div class="portalHeaderLeft">

                    <div class="portalUserAvatar">

                        👤

                    </div>

                    <div>

                        <div id="portalCustomerName" class="portalCustomerName">

                            Customer

                        </div>

                        <div id="portalCustomerPhone" class="portalCustomerPhone">

                        </div>

                    </div>

                </div>

                <div class="portalHeaderRight">

                    <button id="logoutBtn" class="portalGlassButton">

                        Logout

                    </button>

                </div>

            </header>

            <!-- Dashboard Body -->

            <main class="portalMain">

                <!-- Left -->

                <section class="portalLeft">

                    <!-- Customer -->

                    <div id="customerSummaryCard"></div>

                    <!-- Search -->

                    <div id="bookingSearchContainer"></div>

                    <!-- Refresh -->

                    <div id="bookingToolbar">

                        <button id="refreshBookingsBtn" class="portalGlassButton">

                            ↻ Refresh

                        </button>

                    </div>

                    <!-- Booking List -->

                    <div id="bookingListContainer"></div>

                    <!-- Empty -->

                    <div id="bookingEmpty" class="hidden">

                    </div>

                    <!-- Loading -->

                    <div id="bookingLoading" class="hidden">

                    </div>

                </section>

                <!-- Right -->

                <section class="portalRight">

                    <div id="bookingDetailsContainer">

                        <div class="portalGlass portalEmptyDetails">

                            <div class="portalEmptyIcon">

                                📋

                            </div>

                            <div class="portalEmptyTitle">

                                No Booking Selected

                            </div>

                            <div class="portalEmptySub">

                                Select a booking from the left panel.

                            </div>

                        </div>

                    </div>

                </section>

            </main>

        </div>

    </div>


    <!--====================================================
BOOKING MODIFICATION POPUP
=====================================================-->

    <div id="bookingModificationOverlay" class="bookingModificationOverlay hidden">

        <div class="bookingModificationPopup">

            <!--==============================
        HEADER
        ==============================-->

            <div class="bookingModificationHeader">

                <div class="bookingModificationTitle">

                    Booking Modification

                </div>

                <button id="bookingModificationClose" class="bookingModificationClose">

                    ✕

                </button>

            </div>

            <!--==============================
        BODY
        ==============================-->

            <div id="bookingModificationBody" class="bookingModificationBody">

            </div>

            <!--==============================
        FOOTER
        ==============================-->

            <div id="bookingModificationFooter" class="bookingModificationFooter">

            </div>

        </div>

    </div>

    <!--====================================================
LOADING OVERLAY
=====================================================-->

    <div id="bookingLoadingOverlay" class="bookingLoadingOverlay hidden">

        <div class="bookingLoadingCard">

            <div class="bookingLoadingSpinner"></div>

            <div class="bookingLoadingText">

                Processing...

            </div>

        </div>

    </div>

    <!--====================================================
SUCCESS POPUP
=====================================================-->

    <div id="bookingSuccessOverlay" class="bookingSuccessOverlay hidden">

        <div class="bookingSuccessCard">

            <div class="bookingSuccessIcon">

                ✅

            </div>

            <div id="bookingSuccessTitle" class="bookingSuccessTitle">

                Request Submitted

            </div>

            <div id="bookingSuccessMessage" class="bookingSuccessMessage">

                Your request has been submitted successfully.

            </div>

            <button id="bookingSuccessButton" class="bookingSuccessButton">

                OK

            </button>

        </div>

    </div>

    <!--====================================================
ERROR POPUP
=====================================================-->

    <div id="bookingErrorOverlay" class="bookingErrorOverlay hidden">

        <div class="bookingErrorCard">

            <div class="bookingErrorIcon">

                ⚠️

            </div>

            <div id="bookingErrorTitle" class="bookingErrorTitle">

                Something went wrong

            </div>

            <div id="bookingErrorMessage" class="bookingErrorMessage">

            </div>

            <button id="bookingErrorButton" class="bookingErrorButton">

                Close

            </button>

        </div>

    </div>

    <!-- Portal JS -->

    <!-- Environment -->

    <script>

        window.CUSTOMER_ENV = "TEST";

    </script>

    <!-- Portal JS -->
	<script src="dashboard/api.js"></script>
    <script src="customer/customer_auth.js"></script>
    <script src="customer/customer_popup.js"></script>
    <script src="customer/customer_popup_engine.js"></script>
    <script src="customer/customer.js"></script>
    <script src="customer/customer_modification.js"></script>



</body>

</html>
