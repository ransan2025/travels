<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard Login</title>

    <link
        rel="stylesheet"
        href="dashboard/login.css"
    >

</head>


<body>

<div class="loginPage">

    <div class="loginCard">

        <div class="loginLogo">
            🌍
        </div>

        <h1>
            Ransan Travels
        </h1>

        <p>
            Dashboard Login
        </p>


        <div class="loginGroup">

            <label>
                Username
            </label>

            <input
                id="username"
                type="text"
                autocomplete="username"
                placeholder="Enter username"
            >

        </div>


        <div class="loginGroup">

            <label>
                Password
            </label>

            <div class="passwordWrapper">

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Enter password"
                    onkeydown="handleLoginKey(event)"
                >

                <button
                    type="button"
                    onclick="togglePassword()"
                >
                    Show
                </button>

            </div>

        </div>


        <button
            id="loginButton"
            class="loginButton"
            onclick="login()"
        >

            Login

        </button>


        <div
            id="loginError"
            class="loginError hidden"
        ></div>


        <div class="loginEnvironment">

            Environment:

            <strong id="loginEnvironment">
                LIVE
            </strong>

        </div>

    </div>

</div>


<script src="dashboard/api.js"></script>


<script>

/*=========================================================
 SHOW ENVIRONMENT
=========================================================*/

(function () {

    const env =
        (
            localStorage.getItem("env") ||
            "LIVE"
        )
        .toUpperCase();


    document
        .getElementById(
            "loginEnvironment"
        )
        .textContent =
            env;

})();


/*=========================================================
 LOGIN
=========================================================*/

async function login() {

    const username =
        document
            .getElementById("username")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value
            .trim();


    const error =
        document
            .getElementById("loginError");


    const button =
        document
            .getElementById("loginButton");


    error.classList.add(
        "hidden"
    );


    if (
        !username ||
        !password
    ) {

        error.textContent =
            "Please enter username and password.";

        error.classList.remove(
            "hidden"
        );

        return;

    }


    const env =
        (
            localStorage.getItem("env") ||
            "LIVE"
        )
        .toUpperCase();


    button.disabled = true;

    button.textContent =
        "Signing in...";


    try {

        const response =
            await portalLogin(
                username,
                password,
                env
            );


        console.log(
            "[LOGIN] Response:",
            response
        );


        if (
            !response ||
            !response.success
        ) {

            throw new Error(

                response &&
                (
                    response.message ||
                    response.error
                )
                    ? (
                        response.message ||
                        response.error
                    )
                    : "Invalid username or password."

            );

        }


        savePortalLoginSession(
            response
        );


        /*
         * Dashboard
         */

        window.location.replace(
            "dashboard.html"
        );

    }


    catch (err) {

        console.error(
            "[LOGIN] Error:",
            err
        );


        error.textContent =
            err.message ||
            "Login failed.";


        error.classList.remove(
            "hidden"
        );


        button.disabled =
            false;


        button.textContent =
            "Login";

    }

}


/*=========================================================
 ENTER KEY
=========================================================*/

function handleLoginKey(event) {

    if (
        event.key === "Enter"
    ) {

        login();

    }

}


/*=========================================================
 PASSWORD TOGGLE
=========================================================*/

function togglePassword() {

    const field =
        document.getElementById(
            "password"
        );


    field.type =
        field.type === "password"
            ? "text"
            : "password";

}

</script>

</body>

</html>
